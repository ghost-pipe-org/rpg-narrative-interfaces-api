name: CI - Tests and Validation

on:
  pull_request:
    branches: [ main, develop, 'release/**' ]
  push:
    branches: [ develop, 'release/**' ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    # Retry automático em caso de falha temporária do Docker Hub
    continue-on-error: false
    strategy:
      fail-fast: false

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Wait for Docker Hub (retry strategy)
      uses: nick-fields/retry@v3
      with:
        timeout_minutes: 2
        max_attempts: 3
        retry_wait_seconds: 30
        command: docker pull postgres:15 || true
        warning_on_retry: true
      continue-on-error: true

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      uses: nick-fields/retry@v3
      with:
        timeout_minutes: 5
        max_attempts: 3
        retry_wait_seconds: 30
        command: npm ci

    - name: Run Prisma migrations
      run: DATABASE_URL="postgresql://test:1234@localhost:5433/test" npx prisma migrate dev --name init

    - name: Run linting
      run: npx biome check .

    - name: Run type checking
      run: npx tsc --noEmit

    - name: Run tests with coverage
      run: npm run test:coverage

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      uses: nick-fields/retry@v3
      with:
        timeout_minutes: 5
        max_attempts: 3
        retry_wait_seconds: 30
        command: npm ci

    - name: Build application
      run: npm run build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-files
        path: dist/

  deploy:
    runs-on: ubuntu-latest
    needs: [test, build]
    if: startsWith(github.ref, 'refs/heads/release/') && github.event_name == 'push'

    steps:
    - name: Deploy to AWS EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd ${{ secrets.EC2_APP_DIR }}
          git pull origin release/v0.5.0
          docker compose -f docker-compose.prod.yml up -d --build
          docker image prune -f
